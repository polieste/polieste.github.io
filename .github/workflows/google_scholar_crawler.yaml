name: Get Citation Data

# Manual only: Google Scholar blocks GitHub runners, so citation data is
# normally refreshed locally with google_scholar_crawler/update_stats.sh.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Google Scholar often rate-limits GitHub runners and scholarly retries silently;
    # fail fast instead of hanging. The previous data on google-scholar-stats is kept.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Reqs
        run: pip install -r google_scholar_crawler/requirements.txt
      - name: Crawl Google Scholar
        working-directory: ./google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: LtnqkXYAAAAJ
        run: python main.py
      - name: Push to google-scholar-stats branch
        working-directory: ./google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:google-scholar-stats --force
